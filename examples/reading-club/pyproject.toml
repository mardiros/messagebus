[project]
authors = [
    {name = "Guillaume Gauvrit", email = "guillaume@gauvr.it"},
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite<0.20.0,>=0.19.0",
    "messagebus @ file:///${PROJECT_ROOT}/../..",
    "pydantic<3.0.0,>=2.2.1",
    "result<0.11.0,>=0.10.0",
    "sqlalchemy[mypy]<3.0.0,>=2.0.20",
    "celery<6.0.0,>=5.3.1",
]
description = "Review books and rate them"
name = "reading-club"
readme = "README.md"
version = "0.1.0"

[dependency-groups]
dev = [
    "pytest >=9,<10",
    "pytest-asyncio >=0.26.0,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pdm.build]
includes = ["src/reading_club"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
