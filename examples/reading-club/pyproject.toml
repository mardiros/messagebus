[project]
authors = [
    {name = "Guillaume Gauvrit", email = "guillaume@gauvr.it"},
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite >=0.19.0,<0.20.0",
    "messagebus @ file:///${PROJECT_ROOT}/../..",
    "pydantic >=2.2.1,<3.0.0",
    "result >=0.10.0,<0.11.0",
    "sqlalchemy[asyncio,mypy] >=2.0.20,<3.0.0",
    "celery >=5.4,<6.0.0",
]
description = "Review books and rate them"
name = "reading-club"
readme = "README.md"
version = "0.1.0"

[dependency-groups]
dev = [
    "pytest >=9,<10",
    "pytest-asyncio >=1,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pdm.build]
includes = ["src/reading_club"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
